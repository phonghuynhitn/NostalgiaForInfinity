---

x-common-settings:
  &multi-bot-common-settings
  image: freqtradeorg/freqtrade:stable
  build:
    context: .
    dockerfile: "./docker/Dockerfile.custom"
  restart: unless-stopped
  volumes:
    - "./user_data:/freqtrade/user_data"
    - "./user_data/data:/freqtrade/user_data/data"
    - "./configs:/freqtrade/configs"
    - "./tools:/freqtrade/tools:ro"
    - "./${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}.py:/freqtrade/${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}.py"

services:

  pairlist-updater:
    <<: *multi-bot-common-settings
    container_name: nfi-pairlist-updater_binance_futures
    user: "0:0"
    environment:
      PYTHONPATH: /home/ftuser/.local/lib/python3.14/site-packages
    entrypoint: ["python", "/freqtrade/tools/generate-pairlists.py"]
    command: >
      --config /freqtrade/configs/pairlist-generator-binance-futures-usdt.json
      --loop
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import json; from datetime import datetime, timezone; ready=\"/freqtrade/configs/generated/.ready\"; data=json.load(open(ready, encoding=\"utf-8\")); generated_at=datetime.fromisoformat(data[\"generated_at\"].replace(\"Z\", \"+00:00\")); age=(datetime.now(timezone.utc)-generated_at).total_seconds(); raise SystemExit(0 if age <= 3900 else 1)'"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
      start_interval: 5s

  nfi-major:
    <<: *multi-bot-common-settings
    container_name: nfi-major_binance_futures-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}
    depends_on:
      pairlist-updater:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./secrets/nfi-major.env
        required: false
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    command: >
      trade
      --config /freqtrade/configs/recommended_config_major.json
      --db-url sqlite:////freqtrade/user_data/nfi-major_binance_futures-live-tradesv3.sqlite
      --log-file user_data/logs/nfi-major-binance-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}-futures.log
      --strategy-path .

  nfi-mid:
    <<: *multi-bot-common-settings
    container_name: nfi-mid_binance_futures-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}
    depends_on:
      pairlist-updater:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./secrets/nfi-mid.env
        required: false
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    command: >
      trade
      --config /freqtrade/configs/recommended_config_mid.json
      --db-url sqlite:////freqtrade/user_data/nfi-mid_binance_futures-live-tradesv3.sqlite
      --log-file user_data/logs/nfi-mid-binance-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}-futures.log
      --strategy-path .

  # nfi-alt:
  #   <<: *multi-bot-common-settings

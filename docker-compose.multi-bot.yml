  nfi-defi:
    <<: *multi-bot-common-settings
    container_name: nfi-defi_binance_futures-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}
    depends_on:
      pairlist-updater:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./secrets/nfi-defi.env
        required: false
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 1m30s
